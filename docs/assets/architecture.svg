<g font-family="Arial, sans-serif"><text x="35" y="43" fill="#eef9f4" font-size="23" font-weight="700">From captured evidence to executable proof</text><text x="35" y="72" fill="#9bb7af" font-size="15">Agents propose. Application code executes. The comparator decides.</text>
