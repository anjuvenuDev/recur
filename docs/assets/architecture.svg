<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" role="img" aria-labelledby="t d">
<title id="t">Recur architecture and trust boundaries</title><desc id="d">Captured GitHub, database, Stripe, feature flag and trace evidence enters a durable queue. Agents propose bounded state. Deterministic code reconstructs and executes the service. A fingerprint verdict either requests refinement or produces a capsule and a verified regression. Outcomes and traces go to Userlens and Lemma.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#779e93" stroke-width="1.5"/></marker></defs>
